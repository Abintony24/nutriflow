apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutriflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutriflow
  template:
    metadata:
      labels:
        app: nutriflow
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: nutriflow
          image: 504483085764.dkr.ecr.us-east-1.amazonaws.com/nutriflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: nutriflow-secret
                  key: MONGO_URI
            - name: PORT
              value: "8000"
